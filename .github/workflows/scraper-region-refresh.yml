name: Kiku Regional Scraper

on:
  workflow_dispatch:
    inputs:
      pincode:
        description: "6-digit Indian PIN code"
        required: true
        default: "202001"

  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: read

jobs:
  refresh-region:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scraper

    env:
      PYTHONPATH: ${{ github.workspace }}/scraper

      APP_ENV: development
      HOST: 127.0.0.1
      PORT: 8000

      MONGODB_URI: ${{ secrets.MONGODB_URI }}

      APIFY_API_BASE_URL: https://api.apify.com
      APIFY_SWIGGY_ENABLED: "true"
      APIFY_SWIGGY_TOKEN: ${{ secrets.APIFY_SWIGGY_TOKEN }}

      APIFY_ZOMATO_ENABLED: "false"

      REALDATA_API_KEY: ${{ secrets.REALDATA_API_KEY }}
      REALDATA_API_BASE_URL: https://api.realdataapi.com

      APIFY_SWIGGY_REGION_MAX_PAGES: "1"
      APIFY_SWIGGY_MAX_RESULTS: "5"
      APIFY_MAX_CONCURRENT_RUNS: "1"

      REGION_MAX_RESTAURANTS_PER_PROVIDER: "5"
      REGION_MAX_DISHES: "1500"
      REGION_MAX_RESTAURANTS: "100"
      REGION_MAX_CONCURRENT_RESTAURANTS: "2"

      SCRAPER_DEBUG_ERRORS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pymongo[srv]"

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Scrape regional PIN
        env:
          PINCODE: ${{ github.event.inputs.pincode || '202001' }}
        run: |
          python -c "
          import asyncio
          import os
          from app.services import scrape_region

          async def main():
              result = await scrape_region(os.environ['PINCODE'])
              print(
                  f'PIN={result.pincode} '
                  f'dishes={len(result.dishes)} '
                  f'restaurants={len(result.restaurants)} '
                  f'offers={len(result.offers)}'
              )

          asyncio.run(main())
          "

      - name: Persist regional snapshot to MongoDB Atlas
        env:
          PINCODE: ${{ github.event.inputs.pincode || '202001' }}
        run: |
          python scripts/refresh_region.py